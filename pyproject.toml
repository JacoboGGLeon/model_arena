[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "model-arena-sdk"
dynamic = ["version"]
description = "Explicit forecasting competition, fitted models and observable learning histories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Jacobo León"}]
dependencies = [
  "calendar-studio>=0.1.0,<0.2", "numpy>=1.26", "pandas>=2.1", "pydantic>=2.7,<3", "PyYAML>=6",
  "torch>=2.4", "optuna>=4,<5", "polars>=1", "pyarrow>=17",
  "boto3>=1.35", "scipy>=1.12", "streamlit>=1.40", "plotly>=5.24", "ipython>=8",
]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
train = ["torch>=2.4", "optuna>=4,<5"]
aws = ["boto3>=1.35", "pyarrow>=17", "polars>=1"]
monitor = ["streamlit>=1.40", "plotly>=5.24", "polars>=1", "pyarrow>=17", "boto3>=1.35", "ipython>=8"]
mac = ["torch>=2.4", "optuna>=4,<5", "polars>=1", "pyarrow>=17", "boto3>=1.35", "scipy>=1.12", "streamlit>=1.40", "plotly>=5.24", "ipython>=8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "build>=1.2", "twine>=6", "nbformat>=5.10", "hatchling>=1.26"]

[project.scripts]
model-arena = "model_arena.cli:main"

[project.urls]
Repository = "https://github.com/JacoboGGLeon/model_arena"

[tool.hatch.version]
path = "src/model_arena/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/model_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["train: real CPU neural training", "aws: AWS adapter tests using injected clients"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

