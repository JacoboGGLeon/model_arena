name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  POLARS_MAX_THREADS: "2"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested CPU PyTorch for CI
        run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/model_arena --exclude _mac_runtime
      - run: python -m pytest
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c 'import os; from model_arena import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel without repository imports
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-site" dist/*.whl
          export PYTHONPATH="$RUNNER_TEMP/wheel-site"
          python -P -c 'import model_arena, os; assert model_arena.__file__.startswith(os.environ["PYTHONPATH"]), model_arena.__file__'
          python -P -m pytest tests --import-mode=importlib -q
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/*
  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

