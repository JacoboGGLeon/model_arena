name: Tests and distributions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - name: Install tested CPU PyTorch for CI
        run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,mac]'
      - run: python -m ruff check src/model_arena --exclude _mac_runtime
      - run: python -m pytest --junitxml=test-results.xml
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*

